name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  verify:
    name: Verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit required runtime dependencies
        run: npm run audit:runtime

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Package dry run
        run: npm run pack:check

      - name: Package lint
        run: npm run check:package

      - name: Data smoke
        if: github.event_name != 'pull_request'
        run: npm run smoke:data

      - name: Fresh install smoke
        if: github.event_name != 'pull_request'
        run: npm run fresh:check

  playback-smoke:
    name: Playback Smoke
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install system playback backend
        run: sudo apt-get update && sudo apt-get install -y mpv ffmpeg

      - name: Install
        run: npm ci

      - name: Playback smoke
        run: npm run smoke:playback

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json

      - name: Install
        working-directory: apps/docs
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:docs

      - name: Typecheck
        working-directory: apps/docs
        run: npm run check

      - name: Build
        working-directory: apps/docs
        run: npm run build
