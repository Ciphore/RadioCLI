name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:
    inputs:
      experimental_bsd:
        description: Run experimental packed-runtime checks in BSD guest VMs
        type: boolean
        default: false
  schedule:
    - cron: '37 7 * * 1'
  push:
    branches:
      - master
      - main

jobs:
  verify:
    name: Verify
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22.x, 24.x]
        # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
        # Keep the original six jobs, then add the missing CPU architectures.
        include:
          - os: ubuntu-latest
            architecture: x64
          - os: macos-latest
            architecture: arm64
          - os: windows-latest
            architecture: x64
          - os: ubuntu-24.04-arm
            node-version: 22.x
            architecture: arm64
          - os: ubuntu-24.04-arm
            node-version: 24.x
            architecture: arm64
          - os: windows-11-arm
            node-version: 22.x
            architecture: arm64
          - os: windows-11-arm
            node-version: 24.x
            architecture: arm64
          - os: macos-15-intel
            node-version: 22.x
            architecture: x64
          - os: macos-15-intel
            node-version: 24.x
            architecture: x64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          architecture: ${{ matrix.architecture }}
          cache: npm

      - name: Verify native runtime identity
        env:
          RADIOCLI_EXPECTED_ARCH: ${{ matrix.architecture }}
        run: node --input-type=module -e "import assert from 'node:assert/strict'; import os from 'node:os'; assert.equal(process.arch, process.env.RADIOCLI_EXPECTED_ARCH); console.log(JSON.stringify({method:'GitHub-hosted native OS/CPU VM',platform:process.platform,architecture:process.arch,kernel:os.release(),node:process.version}));"

      - name: Install
        run: npm ci

      - name: Audit required runtime dependencies
        id: audit
        env:
          RADIOCLI_AUDIT_EVIDENCE_PATH: output/release-evidence/audit-runtime.json
        run: npm run audit:runtime

      - name: Typecheck
        id: typecheck
        run: npm run check

      - name: Lint
        id: lint
        run: npm run lint

      - name: Test
        id: tests
        # Rendering and storage fixtures can saturate small hosted runners.
        # Bound concurrency without changing assertions or test deadlines.
        env:
          VITEST_MAX_WORKERS: '1'
        run: npm run test

      - name: Package smoke harness tests
        id: harness
        run: node --test scripts/packed-smoke.test-node.mjs scripts/install-smoke-mpv.test-node.mjs scripts/release-evidence.test-node.mjs scripts/audit-ci.test-node.mjs scripts/build-airplay-native.test-node.mjs

      - name: Build
        id: build
        run: npm run build

      - name: MCP stdio smoke
        id: source-mcp
        run: npm run smoke:mcp

      - name: Package dry run
        run: npm run pack:check

      - name: Package lint
        id: package
        run: npm run check:package

      - name: Data smoke
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: npm run smoke:data

      - name: Install native Linux playback fixture
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mpv

      - name: Install pinned native macOS or Windows playback fixture
        if: runner.os != 'Linux'
        env:
          RADIOCLI_SMOKE_EVIDENCE_DIR: output/release-evidence
        run: node scripts/install-smoke-mpv.mjs

      - name: Background CLI playback smoke
        id: background-cli
        run: npm run smoke:cli

      - name: Native TUI crash recovery
        id: native-tui
        env:
          RADIOCLI_REQUIRE_TUI_RECOVERY: '1'
          RADIOCLI_TUI_RECOVERY_BUILT: '1'
        run: npx vitest run src/agent/tui-recovery.native.test.ts

      - name: Native network security and recovery
        id: native-network
        env:
          RADIOCLI_SMOKE_EVIDENCE_DIR: output/release-evidence
        run: npm run smoke:network

      - name: Fresh install smoke
        id: packed
        env:
          RADIOCLI_EXPECTED_ARCH: ${{ matrix.architecture }}
          RADIOCLI_SMOKE_EXECUTION_METHOD: GitHub-hosted native OS/CPU VM (${{ matrix.os }})
          RADIOCLI_SMOKE_EVIDENCE_DIR: output/release-evidence
        run: npm run fresh:check -- --require-mpv --require-clean

      - name: Bind release evidence to this revision and artifact
        if: always()
        env:
          RADIOCLI_CHECK_OUTCOMES: ${{ toJSON(steps) }}
        run: node scripts/release-evidence.mjs output/release-evidence

      - name: Preserve packed runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packed-${{ matrix.os }}-${{ matrix.node-version }}
          path: output/release-evidence/
          if-no-files-found: warn

  playback-smoke:
    name: Playback Smoke
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'schedule'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        node-version: [22.x, 24.x]
        include:
          - os: ubuntu-latest
            architecture: x64
          - os: ubuntu-24.04-arm
            architecture: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          architecture: ${{ matrix.architecture }}
          cache: npm

      - name: Install system playback backend
        run: sudo apt-get update && sudo apt-get install -y mpv mpv-mpris ffmpeg vlc dbus-daemon dbus-bin pipewire pipewire-pulse wireplumber pulseaudio-utils avahi-daemon avahi-utils shairport-sync

      - name: Install
        run: npm ci

      - name: Playback smoke
        # Packed normal/omit-optional installs for this OS/CPU/Node matrix run in verify.
        run: npm run smoke:playback

      - name: Native network and fallback playback
        env:
          RADIOCLI_REQUIRE_FALLBACKS: '1'
        run: npm run smoke:network

      - name: Native desktop media protocol
        # Real session-bus transport on both CPUs and Node lines. This does not
        # establish Hyprland/Quickshell, hardware keys, or audible output.
        run: |
          test -f /usr/lib/mpv-mpris/mpris.so
          dbus-run-session -- npx vitest run src/platform/mpris.native.test.ts src/player/mpv-desktop-media.native.test.ts src/platform/diagnostics.native.test.ts

      - name: Native alarm output restoration
        # Synthetic sinks on an isolated server verify device ownership, not speakers.
        env:
          RADIOCLI_NATIVE_PIPEWIRE_TEST: '1'
        run: dbus-run-session -- npx vitest run src/alarms/system-volume.native.test.ts

      - name: Native AirPlay software receiver
        # Decoded PCM, authentication, controls and cleanup; no physical receiver claim.
        env:
          RADIOCLI_NATIVE_AIRPLAY_TEST: '1'
        run: |
          sudo systemctl start avahi-daemon
          npx vitest run src/player/airplay.native.test.ts

  docs:
    name: Docs
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json

      - name: Install
        working-directory: apps/docs
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:docs

      - name: Typecheck
        working-directory: apps/docs
        run: npm run check

      - name: Build
        working-directory: apps/docs
        run: npm run build

  required-release-checks:
    name: Required Release Checks
    needs: [verify, playback-smoke, docs]
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Require all maintained-platform jobs
        env:
          VERIFY: ${{ needs.verify.result }}
          PLAYBACK: ${{ needs.playback-smoke.result }}
          DOCS: ${{ needs.docs.result }}
        run: test "$VERIFY" = success && test "$PLAYBACK" = success && test "$DOCS" = success

  # Experimental jobs run in full guest kernels, not Linux containers. They are
  # opt-in/weekly and do not establish maintained or audible-playback support.
  # VM action source is pinned; upstream release assets/images are maintained
  # separately by vmactions. The selected guest versions and actual runtimes are logged.
  experimental-package:
    name: Build experimental portability artifact
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.experimental_bsd)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup build Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install build dependencies
        run: npm ci --omit=optional

      - name: Build the npm artifact for guest installation
        run: |
          mkdir -p portability-artifact
          npm pack --pack-destination portability-artifact
          cp scripts/packed-smoke.mjs portability-artifact/
          sha256sum portability-artifact/*.tgz

      - name: Preserve the built package and standalone harness
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portability-package
          path: portability-artifact/
          if-no-files-found: error

  experimental-freebsd:
    name: Experimental FreeBSD 14.4 x64 guest / Node 22
    needs: experimental-package
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download the Linux-built npm package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portability-package
          path: portability-artifact

      - name: Install and exercise JavaScript in FreeBSD
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: '14.4'
          arch: x86_64
          copyback: false
          prepare: pkg install -y node22 npm-node22 mpv
          run: |
            set -eu
            uname -a
            node --version
            npm --version
            cd portability-artifact
            set -- ./*.tgz
            test "$#" -eq 1
            node packed-smoke.mjs "$1" --omit-optional --require-mpv --execution-method 'QEMU FreeBSD 14.4 x86_64 guest kernel; null audio'

  experimental-openbsd:
    name: Experimental OpenBSD 7.9 x64 guest / packaged Node
    needs: experimental-package
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download the Linux-built npm package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portability-package
          path: portability-artifact

      - name: Install and exercise JavaScript in OpenBSD
        uses: vmactions/openbsd-vm@86cdc08415d9d0865267e686561e276c52d62530 # v1.4.7
        with:
          release: '7.9'
          arch: x86_64
          copyback: false
          prepare: pkg_add -I node mpv
          run: |
            set -eu
            uname -a
            node --version
            npm --version
            cd portability-artifact
            set -- ./*.tgz
            test "$#" -eq 1
            node packed-smoke.mjs "$1" --omit-optional --require-mpv --execution-method 'QEMU OpenBSD 7.9 x86_64 guest kernel; null audio'

  experimental-netbsd:
    name: Experimental NetBSD 10.1 x64 guest / Node 22
    needs: experimental-package
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download the Linux-built npm package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portability-package
          path: portability-artifact

      - name: Install and exercise JavaScript in NetBSD
        uses: vmactions/netbsd-vm@7f23a491dcc69c34195721ab67934917707f84c7 # v1.4.9
        with:
          release: '10.1'
          arch: x86_64
          copyback: false
          prepare: |
            set -eu
            export PATH=/usr/pkg/bin:/usr/pkg/sbin:$PATH
            # The minimal guest omits X11 libraries required by pkgsrc mpv,
            # even for null audio/video. Install the matching official OS set.
            # The matching 10.1 set moved to the official release archive.
            # Digest: NetBSD-10.1/amd64/binary/sets/SHA512 on archive.netbsd.org.
            radiocli_xbase=$(mktemp /tmp/radiocli-xbase.XXXXXX)
            trap 'rm -f "$radiocli_xbase"' EXIT
            ftp -q 60 -o "$radiocli_xbase" https://archive.netbsd.org/pub/NetBSD-archive/NetBSD-10.1/amd64/binary/sets/xbase.tar.xz
            test "$(cksum -a SHA512 -q "$radiocli_xbase")" = b6ac2195f91d7ae395ec2734c9ae2a4727014629fbdc94562531225e0d51e3b2705047e8440fcf75e1dacdcecb3cb980df7a82f838c12ad5274ba8ce95e49b72
            tar -xpf "$radiocli_xbase" -C /
            /usr/sbin/pkg_add pkgin
            pkgin -y update
            pkgin -y install 'nodejs>=22<23' mpv
            mpv --version
          run: |
            set -eu
            export PATH=/usr/pkg/bin:/usr/pkg/sbin:$PATH
            uname -a
            node --version
            npm --version
            cd portability-artifact
            set -- ./*.tgz
            test "$#" -eq 1
            node packed-smoke.mjs "$1" --omit-optional --require-mpv --execution-method 'QEMU NetBSD 10.1 x86_64 guest kernel; null audio'
